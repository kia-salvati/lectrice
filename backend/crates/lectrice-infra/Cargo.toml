[package]
name = "lectrice-infra"
description = "Adapters: PDF text, sentence splitting, the speech engine, encoders, storage and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["pdfium", "kokoro", "sherpa-static", "ffmpeg-export", "time-stretch"]
pdfium = ["dep:pdfium-render"]
kokoro = ["dep:sherpa-onnx"]
sherpa-static = ["kokoro", "sherpa-onnx/static"]
ffmpeg-export = []
time-stretch = []
# The phone's side of the computer helper: the `SpeechHelper` adapter over `lectrice-link`'s client.
helper-client = ["dep:lectrice-link", "lectrice-link/client"]

[dependencies]
lectrice-domain.workspace = true
lectrice-link = { workspace = true, optional = true }
tracing.workspace = true
chrono.workspace = true
sherpa-onnx = { workspace = true, optional = true }
pdfium-render = { workspace = true, optional = true }
sentencex.workspace = true
sha2.workspace = true
hound.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "export_ffmpeg"
required-features = ["ffmpeg-export", "time-stretch"]

[[test]]
name = "pdf_books"
required-features = ["pdfium"]

[[test]]
name = "pdf_fixtures"
required-features = ["pdfium"]

[[test]]
name = "pdf_outline"
required-features = ["pdfium"]

[[test]]
name = "pdf_source"
required-features = ["pdfium"]

[[test]]
name = "speech_kokoro"
required-features = ["kokoro"]

[[test]]
name = "helper_link"
required-features = ["helper-client"]

[dev-dependencies]
lectrice-app.workspace = true
lectrice-link = { workspace = true, features = ["client", "server", "testing"] }

[lints]
workspace = true
